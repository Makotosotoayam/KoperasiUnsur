name: Keep Supabase Active

on:
  schedule:
    # Runs every 4 days at 02:00 UTC (09:00 WIB)
    - cron: '0 2 */4 * *'
  workflow_dispatch: # Lets you run it manually to test

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Query keep_alive table
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Supabase response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Ping failed!"
            exit 1
          fi
